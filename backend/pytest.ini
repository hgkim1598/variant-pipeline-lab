# Run from backend/:  .venv/Scripts/python.exe -m pytest -q
#
# pythonpath = . makes `import app...` work without installing the project:
# there is no pyproject/setup.py here on purpose, so the app is imported from
# the source tree the same way uvicorn does it (--app-dir backend).
[pytest]
testpaths = app/tests
pythonpath = .
addopts = -q
